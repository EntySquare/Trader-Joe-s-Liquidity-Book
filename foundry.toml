[profile.default]
src = 'src'
out = 'out'
libs = ['lib']
solc_version = "0.8.20"
evm_version = 'paris' 
optimizer = true
optimizer_runs = 800

fs_permissions = [{ access = "read", path = "./"}]

[fuzz]
runs = 1024

[rpc_endpoints]
avalanche = "https://api.avax.network/ext/bc/C/rpc"
fuji = "https://api.avax-test.network/ext/bc/C/rpc"
bsc_testnet = "https://data-seed-prebsc-1-s1.bnbchain.org:8545"
bsc_mainnet = "https://bsc-dataseed.bnbchain.org"

[etherscan]
arbitrum = { key = "${ARBISCAN_API_KEY}", chain = 42161 }
avalanche = { key = "${SNOWTRACE_API_KEY}", chain = 43114 }
arbitrum_goerli = { key = "${ARBISCAN_API_KEY}", chain = 421613 }
fuji = { key = "${SNOWTRACE_API_KEY}", chain = 43113 }
bsc = { key = "${BSCSCAN_API_KEY}", chain = 56 }
bsc_testnet = { key = "${BSCSCAN_API_KEY}", chain = 97 }

# See more config options https://github.com/foundry-rs/foundry/tree/master/config